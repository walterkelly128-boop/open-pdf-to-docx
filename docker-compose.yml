services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: open-pdf-to-docx:local
    ports:
      - "8000:8000"
    environment:
      MAX_UPLOAD_MB: "100"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
